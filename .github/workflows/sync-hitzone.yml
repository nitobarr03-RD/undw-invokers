name: Sync HitZone news

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read the latest public HitZone update
        run: python scripts/sync_hitzone.py
      - name: Save updated news feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hitzone-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar noticias públicas de HitZone'
            git push
          else
            echo 'La publicación oficial no cambió.'
          fi
